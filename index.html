<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duhoc Mate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Duhoc Mate</title>
  </head>
  <body>
    <!-- ── Splash Screen ── -->
    <div id="splash" style="
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #e9eff8 0%, #d6e4f7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    ">
      <div style="
        background-color: #ffffff;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(39,82,255,0.28), 0 4px 12px rgba(39,82,255,0.12);
        margin-bottom: 20px;
        animation: splash-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
      ">
        <img src="/logo.png" alt="Duhoc Mate" style="width:100%;height:100%;object-fit:cover;" />
      </div>
      <div style="font-size:28px;font-weight:900;letter-spacing:-0.03em;color:#0f172a;margin-bottom:6px;">
        Duhoc Mate
      </div>
      <div style="font-size:13px;color:#64748b;letter-spacing:0.01em;">
        Đồng hành cùng du học sinh Việt Nam tại Hàn Quốc
      </div>
      <div style="margin-top:40px;position:relative;width:56px;height:3px;background:#dde5f0;border-radius:3px;overflow:hidden;">
        <div style="
          position:absolute;inset:0;
          background:linear-gradient(90deg,#4f73ff,#2752ff);
          border-radius:3px;
          animation:splash-progress 1.4s ease-in-out infinite;
        "></div>
      </div>
      <style>
        @keyframes splash-pop {
          0%   { transform: scale(0.7); opacity: 0; }
          100% { transform: scale(1);   opacity: 1; }
        }
        @keyframes splash-progress {
          0%   { transform: translateX(-100%); }
          50%  { transform: translateX(0%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=20260507-admin-dashboard"></script>
  </body>
</html>
